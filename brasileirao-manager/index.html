function tacticalMods(teamId){if(teamId!==state.clubId)return {atk:0,def:0,fatigue:1};let t=currentTactics(),atk=0,def=0,fatigue=1;if(t.mentality==='Ofensivo'){atk+=3;def-=2}else if(t.mentality==='Defensivo'){atk-=2;def+=3}if(t.pressing==='Alto'){atk+=1;def+=1;fatigue+=.45}else if(t.pressing==='Baixo'){def+=1;fatigue-=.15}if(t.defLine==='Alta'){atk+=1;def-=1;fatigue+=.12}else if(t.defLine==='Baixa'){atk-=1;def+=2}if(t.tempo==='Rápido'){atk+=2;def-=1;fatigue+=.25}else if(t.tempo==='Lento'){atk-=1;def+=1;fatigue-=.1}if(t.width==='Ampla')atk+=1; if(t.width==='Fechada')def+=1;return {atk,def,fatigue}}

function ensureMarketState(){
 state.transferHistory=state.transferHistory||[];state.marketFilters=state.marketFilters||{q:'',pos:'Todos',club:'Todos',maxValue:'',maxAge:''};
 for(const t of state.teams||[]){for(const p of t.players||[]){if(p.wage==null)p.wage=estimateWage(p);if(p.contract==null)p.contract=rand(1,4);}}
}
function estimateWage(p){return Math.max(35,Math.round((p.ovr*p.ovr/34)+(p.value*1.8)+(p.age>30?25:0)))}
function playerClub(pid){return state.teams.find(t=>t.players.some(p=>p.id===Number(pid)))}
function playerById(pid){let c=playerClub(pid);return c?c.players.find(p=>p.id===Number(pid)):null}
function askingPrice(p,c){let mult=1.08+(p.pot-p.ovr)*.025+(p.age<24?.10:0)+(p.starter?.10:0);if(c.players.length<=20)mult+=.08;return Math.round(p.value*mult*10)/10}
function minAccept(p,c){return Math.round(askingPrice(p,c)*(.89+Math.random()*.045)*10)/10}
function wageDemand(p){return Math.round(p.wage*(1.08+(p.ovr>=80?.12:0))/5)*5}
function fmtWage(v){return 'R$ '+Math.round(v).toLocaleString('pt-BR')+' mil/mês'}

function openNegotiation(pid){ensureMarketState();let p=playerById(pid),c=playerClub(pid);if(!p||!c||c.id===state.clubId)return;let ask=askingPrice(p,c),wd=wageDemand(p);state.marketNegotiation={pid:p.id,clubId:c.id,ask,clubMin:Math.round(ask*.91*10)/10,wageDemand:wd,offer:Math.round(ask*.88*10)/10,wage:wd,years:3,status:'Aberta',message:`${c.name} pede ${fmt(ask)} por ${p.name}.`};save();render('market')}

function submitOffer(){let n=state.marketNegotiation;if(!n)return;let p=playerById(n.pid),c=playerClub(n.pid);if(!p||!c){state.marketNegotiation=null;return render('market')}let offer=Number(n.offer)||0,wage=Number(n.wage)||0;if(offer>me().budget){n.status='Recusada';n.message='Seu clube não possui orçamento suficiente para essa proposta.';save();return render('market')}let hardMin=n.clubMin||askingPrice(p,c)*.91;if(offer<hardMin*.86){n.status='Recusada';n.message=`${c.name} recusou. A proposta está muito distante do valor esperado.`;n.clubMin=Math.round(hardMin*.99*10)/10;save();return render('market')}if(offer<hardMin){let counter=Math.max(hardMin,Math.round(((offer+askingPrice(p,c))/2)*10)/10);n.status='Contraproposta';n.clubMin=Math.round(counter*10)/10;n.offer=n.clubMin;n.message=`${c.name} fez contraproposta de ${fmt(n.clubMin)}.`;save();return render('market')}if(wage<n.wageDemand*.92){n.status='Salário recusado';n.message=`O jogador aceitou conversar com seu clube, mas pede pelo menos ${fmtWage(n.wageDemand)}.`;save();return render('market')}completeTransfer(p,c,offer,wage,n.years);}

function viewMarket(){ensureMarketState();let f=state.marketFilters||{},mine=me();let all=[];for(const c of state.teams){if(c.id===state.clubId)continue;for(const p of c.players)all.push({p,c})}let q=(f.q||'').toLowerCase(),maxV=Number(f.maxValue)||Infinity,maxA=Number(f.maxAge)||Infinity;let list=all.filter(({p,c})=>(!q||p.name.toLowerCase().includes(q)||c.name.toLowerCase().includes(q))&&(f.pos==='Todos'||!f.pos||p.pos===f.pos)&&(f.club==='Todos'||!f.club||String(c.id)===String(f.club))&&p.value<=maxV&&p.age<=maxA).sort((a,b)=>b.p.ovr-a.p.ovr||b.p.value-a.p.value).slice(0,100);let n=state.marketNegotiation;let nego='';if(n){let p=playerById(n.pid),c=playerClub(n.pid);if(n.completed){nego=`<div class="negobox transferok"><h2>✅ Negócio fechado</h2><p>${n.message}</p><button class="btn" onclick="closeNegotiation()">Continuar no mercado</button></div>`}else if(p&&c){nego=`<div class="negobox"><div style="display:flex;justify-content:space-between;gap:12px"><div><div class="tagclub">NEGOCIAÇÃO COM ${c.name.toUpperCase()}</div><h2 style="margin:4px 0">${p.name} <span class="pill">${p.pos}</span></h2><div class="muted">OVR ${p.ovr} · POT ${p.pot} · ${p.age} anos · valor ${fmt(p.value)}</div></div><button class="btn secondary" onclick="closeNegotiation()">Fechar</button></div><div class="response"><b>${n.status}</b><div class="tiny muted" style="margin-top:4px">${n.message}</div></div><div class="negogrid"><div><label class="tiny muted">Proposta ao clube (R$ mi)</label><input class="moneyinput" type="number" step="0.1" value="${n.offer}" onchange="updateNego('offer',this.value)"></div><div><label class="tiny muted">Salário (R$ mil/mês)</label><input class="moneyinput" type="number" step="5" value="${n.wage}" onchange="updateNego('wage',this.value)"></div><div><label class="tiny muted">Contrato</label><select class="moneyinput" onchange="updateNego('years',this.value)">${[1,2,3,4,5].map(y=>`<option value="${y}" ${n.years===y?'selected':''}>${y} ano${y>1?'s':''}</option>`).  let hist=state.transferHistory.slice(0,8);return `<div class="grid"><div class="card span12"><h1>Central de Transferências</h1><p class="muted">Busque atletas dos outros clubes, negocie taxa de transferência, salário e duração do contrato. Valores e salários são atributos simulados do jogo.</p><div class="marketstats"><div class="card"><div class="muted tiny">ORÇAMENTO</div><div class="kpi">${fmt(mine.budget)}</div></div><div class="card"><div class="muted tiny">ELENCO</div><div class="kpi">${mine.players.length}</div><div class="tiny muted">jogadores</div></div><div class="card"><div class="muted tiny">NEGÓCIOS</div><div class="kpi">${state.transferHistory.length}</div><div class="tiny muted">concluídos</div></div></div>${nego}<div class="marketfilters"><input placeholder="Buscar jogador ou clube..." value="${f.q||''}" onchange="setMarketFilter('q',this.value)"><select onchange="setMarketFilter('pos',this.value)">${['Todos','GOL','LD','LE','ZAG','VOL','MC','MEI','PE','PD','ATA'].map(x=>`<option ${f.pos===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="setMarketFilter('club',this.value)"><option value="Todos">Todos os clubes</option>${state.teams.filter(t=>t.id!==state.clubId).map(t=>`<option value="${t.id}" ${String(f.club)===String(t.id)?'selected':''}>${t.name}</option>`).join('')}</select><input type="number" placeholder="Valor máx. R$ mi" value="${f.maxValue||''}" onchange="setMarketFilter('maxValue',this.value)"><input type="number" placeholder="Idade máx." value="${f.maxAge||''}" onchange="setMarketFilter('maxAge',this.value)"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="muted tiny">${list.length} resultados exibidos</div><button class="btn secondary" onclick="resetMarketFilters()">Limpar filtros</button></div><div class="marketplayer muted tiny"><b>JOGADOR</b><b>POS</b><b>OVR</b><b class="hideMobile">IDADE</b><b class="hideMobile">CLUBE</b><b>VALOR</b><b></b></div>${list. function simGame(g){let H=team(g.h),A=team(g.aw),hm=tacticalMods(H.id),am=tacticalMods(A.id);let hs=avg(H)+3+hm.atk-am.def,as=avg(A)+am.atk-hm.def;let expH=Math.max(.3,1.25+(hs-as)*.055),expA=Math.max(.25,1.05+(as-hs)*.055);let goals=l=>{let L=Math.exp(-l),p=1,k=0;do{k++;p*=Math.random()}while(p>L&&k<7);return k-1};g.hs=goals(expH);g.as=goals(expA);g.played=true;update(g.h,g.aw,g.hs,g.as);return g}
function update(h,a,hs,as){let H=state.table.find(x=>x.id===h),A=state.table.find(x=>x.id===a);H.j++;A.j++;H.gp+=hs;H.gc+=as;A.gp+=as;A.gc+=hs;H.sg=H.gp-H.gc;A.sg=A.gp-A.gc;if(hs>as){H.v++;A.d++;H.p+=3}else if(hs<as){A.v++;H.d++;A.p+=3}else{H.e++;A.e++;H.p++;A.p++}}
function simulateRound(){if(state.round>=38)return;let rnd=state.fixtures[state.round];rnd.forEach(simGame);let my=rnd.find(g=>g.h===state.clubId||g.aw===state.clubId);let opp=team(my.h===state.clubId?my.aw:my.h);let mine=my.h===state.clubId?my.hs:my.as,theirs=my.h===state.clubId?my.as:my.hs;let title=mine>theirs?'Vitória!':mine===theirs?'Empate':'Derrota';state.news.unshift({t:`${title} ${mine} × ${theirs}`,d:`${me().name} contra ${opp.name} pela rodada ${state.round+1}.`}); // form & fitness
let fm=tacticalMods(state.clubId),benchIds=new Set((state.benchByFormation?.[state.formation]||[]).map(Number));me().players.forEach(p=>{if(p.starter){p.fitness=Math.max(62,p.fitness-Math.round(rand(5,10)*fm.fatigue));p.form=Math.max(55,Math.min(95,p.form+(mine>theirs?rand(0,3):mine<theirs?-rand(0,3):rand(-1,1))))}else p.fitness=Math.min(100,p.fitness+(benchIds.has(p.id)?2:4))});let tired=lineupPlayers().filter(p=>p.fitness<72);if(tired.length&&benchIds.size){let sub=tired[0],repl=me().players.filter(p=>benchIds.has(p.id)).sort((a,b)=>b.fitness-a.fitness||b.ovr-a.ovr)[0];if(repl)state.news.unshift({t:`Substituição automática: ${repl.name}`,d:`Entrou no decorrer da partida no lugar de ${sub.name}, que terminou com ${sub.fitness}% de físico.`})};
state.round++;if(state.round===38){let champ=team(sortedTable()[0].id).name;state.news.unshift({t:`${champ} é campeão brasileiro!`,d:'A temporada 2026 foi concluída.'})}save();render('home')}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
load();if(state){state.formation=state.formation||'4-2-3-1';state.lineup=state.lineup||{};ensureLineupStores();if(Object.keys(state.lineup).length===0)autoLineup(false);rememberDraft();if(!state.savedLineups[state.formation])state.savedLineups[state.formation]={...state.lineup};ensureTacticalState();ensureMarketState();}render();
</script></body></html>
